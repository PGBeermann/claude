<html>
<head>
<style>
    body  { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; background: #f8fafc; }
    button { padding: 8px 20px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #93c5fd; cursor: not-allowed; }

    #output {
        margin-top: 16px;
        font-family: 'Courier New', monospace;
        font-size: 13px;
        background: #0f172a;
        color: #94a3b8;
        padding: 14px;
        border-radius: 8px;
        white-space: pre-wrap;
        min-height: 40px;
        display: flex;
        flex-direction: column;
        gap: 0;
    }
    #output:empty { display: none; }

    .out-line { display: block; color: #e2e8f0; }
    .out-warn { display: block; color: #fbbf24; }
    .out-err  { display: block; color: #f87171; font-weight: 600; }
    .out-img  {
        max-width: 100%;
        border: 1px solid #334155;
        border-radius: 8px;
        margin: 8px 0;
        display: block;
        box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    textarea {
        resize: vertical;
        font-family: 'Courier New', Courier, monospace;
        font-size: 2.0rem;
        tab-size: 4;
        white-space: pre;
        overflow-wrap: normal;
    }
</style>
</head>
<body>

    <h2>WebR Output Demo</h2>
    <button id="btn">Run R</button><br>
    <textarea style="width:800px;" id="input" cols="20" rows="10" spellcheck="false"></textarea>

    <!-- Combined output: text and images interleaved in command order -->
    <div id="output"></div>

<script type="module">
    import { WebR } from 'https://webr.r-wasm.org/latest/webr.mjs';

    const webR = new WebR();
    await webR.init();

    // ── helpers ──────────────────────────────────────────────────────────
    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
    }

    function bitmapToImg(bitmap) {
        const canvas = document.createElement('canvas');
        canvas.width  = bitmap.width;
        canvas.height = bitmap.height;
        canvas.getContext('2d').drawImage(bitmap, 0, 0);
        const img = document.createElement('img');
        img.src = canvas.toDataURL('image/png');
        img.alt = 'R plot';
        img.className = 'out-img';
        return img;
    }

    function appendSpan(parent, cls, text) {
        const span = document.createElement('span');
        span.className = cls;
        span.textContent = text;
        parent.appendChild(span);
    }

    // ── run on button click ───────────────────────────────────────────────
    const btn = document.getElementById('btn');

    btn.addEventListener('click', async () => {
        const outputEl = document.getElementById('output');
        outputEl.innerHTML = '';
        appendSpan(outputEl, 'out-warn', 'Running...');
        btn.disabled = true;

        const userCode = document.getElementById('input').value;

        try {
            // Close any open devices from previous runs, then open a fresh canvas device.
            // dev.off() at the end flushes the last plot page as a canvas message.
            const code = [
                'try(graphics.off(), silent=TRUE)',
                'webr::canvas(width=720, height=480)',
                userCode,
                'try(dev.off(), silent=TRUE)',
            ].join('\n');

            await webR.writeConsole(code + '\n');

            outputEl.innerHTML = '';

            // Read messages in the order WebR produces them.
            // stdout/stderr/message arrive immediately; canvas images arrive when
            // a page is finalised (new plot started or dev.off() called), so they
            // appear inline between text messages in the correct sequence.
            messageLoop: while (true) {
                const msg = await webR.read();

                switch (msg.type) {
                    case 'stdout':
                        appendSpan(outputEl, 'out-line', msg.data);
                        break;
                    case 'stderr':
                        appendSpan(outputEl, 'out-err', msg.data);
                        break;
                    case 'message':
                        appendSpan(outputEl, 'out-warn', msg.data);
                        break;
                    case 'canvas':
                        if (msg.data.event === 'canvasImage') {
                            outputEl.appendChild(bitmapToImg(msg.data.image));
                        }
                        break;
                    case 'prompt':
                        break messageLoop;
                }
            }

            if (outputEl.children.length === 0) {
                appendSpan(outputEl, 'out-warn', 'No output.');
            }

        } catch (err) {
            outputEl.innerHTML = '';
            appendSpan(outputEl, 'out-err', 'Error: ' + err.message);
        } finally {
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
