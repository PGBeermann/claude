<html>
<head>
<style>
    body  { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; background: #f8fafc; }
    button { padding: 8px 20px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background: #1d4ed8; }

    #output {
        margin-top: 16px;
        font-family: 'Courier New', monospace;
        font-size: 13px;
        background: #0f172a;
        color: #94a3b8;
        padding: 14px;
        border-radius: 8px;
        white-space: pre-wrap;
        min-height: 40px;
    }
    #output:empty { display: none; }

    .out-line { display: block; color: #e2e8f0; }
    .out-warn { display: block; color: #fbbf24; }
    .out-err  { display: block; color: #f87171; font-weight: 600; }

    #plots { margin-top: 16px; display: flex; flex-direction: column; gap: 12px; }
    #plots img {
        max-width: 100%;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    textarea {
        resize: vertical;
        font-family: 'Courier New', Courier, monospace;
        font-size: 2.0rem;
        tab-size: 4;
        white-space: pre;
        overflow-wrap: normal;
    }
</style>
</head>
<body>

    <h2>WebR Output Demo</h2>
    <button id="btn">Run R</button><br>
    <button id="btn2" onclick="getLines();">Run R2</button><br>
    <textarea style="width:800px;" id="input" cols="20" rows="10" spellcheck="false">
x=rnorm(100)
print(x)
plot(x)

    </textarea>

    <!-- Text output -->
    <div id="output"></div>

    <!-- Plot output -->
    <div id="plots"></div>

<script type="module">
    import { WebR } from 'https://webr.r-wasm.org/latest/webr.mjs';

    const webR = new WebR();
    await webR.init();

    // ── helpers ──────────────────────────────────────────────────────────
    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
    }

    function bitmapToImg(bitmap) {
        const canvas = document.createElement('canvas');
        canvas.width  = bitmap.width;
        canvas.height = bitmap.height;
        canvas.getContext('2d').drawImage(bitmap, 0, 0);
        const img = document.createElement('img');
        img.src = canvas.toDataURL('image/png');
        img.alt = 'R plot';
        return img;
    }

    // ── run on button click ───────────────────────────────────────────────
    async function ejecutar(cmd2) {
        const outputEl = document.getElementById('output');
        const plotsEl  = document.getElementById('plots');

        outputEl.innerHTML = '<span class="out-warn">Running...</span>';
        plotsEl.innerHTML  = '';

        try {
            const shelter = await new webR.Shelter();

            const result = await shelter.captureR(cmd2, {
                withAutoprint: true,
                captureGraphics: { width: 720, height: 480 }
            });

            // ── 1. Text output ──────────────────────────────────────────
            outputEl.innerHTML = result.output.map(line => {
                const text = escapeHtml(line.data);
                if (line.type === 'stdout')  return `<span class="out-line">${text}</span>`;
                if (line.type === 'stderr')  return `<span class="out-err">${text}</span>`;
                if (line.type === 'message') return `<span class="out-warn">${text}</span>`;
                return '';
            }).join('') || '<span class="out-warn">No text output.</span>';

            // ── 2. Plot output ──────────────────────────────────────────
            (result.images || []).forEach(bitmap => {
                plotsEl.appendChild(bitmapToImg(bitmap));
            });

            await shelter.purge();

        } catch (err) {
            outputEl.innerHTML = `<span class="out-err">Error: ${escapeHtml(err.message)}</span>`;
        }
    }

    // Expose to global scope so non-module scripts can call it
    window.ejecutar = ejecutar;

    document.getElementById('btn').addEventListener('click', () => {
        const cmd2 = document.getElementById('input').value;
        ejecutar(cmd2);
    });
</script>

<script>
function getLines() {
    const textarea = document.getElementById('input');
    const contenido = textarea.value;
    const lineas = contenido.split('\n');
    lineas.forEach(linea => ejecutar(linea));
}
</script>

</body>
</html>
